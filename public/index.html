<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Universal Mobile Viewport Settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    
    <!-- Mobile App Settings -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Heron Square Maintenance" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Mobile Compatibility -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="width" />
    
    <!-- Cross-Platform Mobile Support -->
    <meta name="msapplication-config" content="none" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/logo192.png" />
    
    <!-- Android Specific -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Heron Square Maintenance" />
    
    <!-- iOS Specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Heron Square" />
    
    <!-- Huawei and Other Android Devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no, target-densitydpi=device-dpi" />
    
    <meta
      name="description"
      content="Heron Square Maintenance App - Tenant issue tracking system"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Heron Square Maintenance</title>
    
    <!-- iOS Safari Fixes -->
    <style>
      /* Fix for iOS Safari 100vh issue */
      html, body {
        height: 100%;
        height: -webkit-fill-available;
        overflow-x: hidden;
      }
      
      /* Prevent zoom on input focus in iOS */
      input, textarea, select {
        font-size: 16px !important;
        -webkit-appearance: none;
        border-radius: 0;
      }
      
      /* Fix for iOS Safari flexbox issues */
      .min-h-screen {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      
      /* Fix for iOS Safari tap highlight */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Fix for iOS Safari scrolling */
      body {
        -webkit-overflow-scrolling: touch;
      }
    </style>
    
    <!-- Universal Mobile JavaScript Fixes -->
    <script>
      // Detect mobile device
      function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
               (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);
      }
      
      // Fix viewport height for all mobile devices
      function fixViewportHeight() {
        if (isMobile()) {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `${vh}px`);
          
          // Apply fixes for different mobile platforms
          if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            // iOS fixes
            document.documentElement.style.height = '-webkit-fill-available';
            document.body.style.height = '-webkit-fill-available';
          } else if (/Android/i.test(navigator.userAgent)) {
            // Android fixes
            document.documentElement.style.height = '100vh';
            document.body.style.height = '100vh';
          } else {
            // Other mobile devices
            document.documentElement.style.height = '100vh';
            document.body.style.height = '100vh';
          }
        }
      }
      
      // Fix input zoom issues
      function fixInputZoom() {
        if (isMobile()) {
          const inputs = document.querySelectorAll('input, textarea, select');
          inputs.forEach(input => {
            input.style.fontSize = '16px';
            input.addEventListener('focus', function() {
              this.style.fontSize = '16px';
            });
          });
        }
      }
      
      // Apply fixes when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          fixViewportHeight();
          fixInputZoom();
        });
      } else {
        fixViewportHeight();
        fixInputZoom();
      }
      
      // Apply fixes on window resize
      window.addEventListener('resize', fixViewportHeight);
      window.addEventListener('orientationchange', function() {
        setTimeout(fixViewportHeight, 100);
      });
      
      // Fix for mobile Safari address bar
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.addEventListener('scroll', function() {
          if (document.documentElement.scrollTop === 0) {
            document.documentElement.scrollTop = 1;
          }
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">

      name="description"
      content="Heron Square Maintenance App - Tenant issue tracking system"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Heron Square Maintenance</title>
    
    <!-- iOS Safari Fixes -->
    <style>
      /* Fix for iOS Safari 100vh issue */
      html, body {
        height: 100%;
        height: -webkit-fill-available;
        overflow-x: hidden;
      }
      
      /* Prevent zoom on input focus in iOS */
      input, textarea, select {
        font-size: 16px !important;
        -webkit-appearance: none;
        border-radius: 0;
      }
      
      /* Fix for iOS Safari flexbox issues */
      .min-h-screen {
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }
      
      /* Fix for iOS Safari tap highlight */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Fix for iOS Safari scrolling */
      body {
        -webkit-overflow-scrolling: touch;
      }
    </style>
    
    <!-- Universal Mobile JavaScript Fixes -->
    <script>
      // Browser compatibility polyfills
      (function() {
        // Polyfill for older browsers
        if (!window.Promise) {
          console.warn('Promise not supported - adding polyfill');
          // Basic Promise polyfill
          window.Promise = function(executor) {
            var self = this;
            self.state = 'pending';
            self.value = undefined;
            self.reason = undefined;
            self.onFulfilledCallbacks = [];
            self.onRejectedCallbacks = [];
            
            function resolve(value) {
              if (self.state === 'pending') {
                self.state = 'fulfilled';
                self.value = value;
                self.onFulfilledCallbacks.forEach(function(callback) {
                  callback(value);
                });
              }
            }
            
            function reject(reason) {
              if (self.state === 'pending') {
                self.state = 'rejected';
                self.reason = reason;
                self.onRejectedCallbacks.forEach(function(callback) {
                  callback(reason);
                });
              }
            }
            
            try {
              executor(resolve, reject);
            } catch (e) {
              reject(e);
            }
          };
          
          window.Promise.prototype.then = function(onFulfilled, onRejected) {
            var self = this;
            var promise2 = new window.Promise(function(resolve, reject) {
              if (self.state === 'fulfilled') {
                setTimeout(function() {
                  try {
                    var x = onFulfilled ? onFulfilled(self.value) : self.value;
                    resolve(x);
                  } catch (e) {
                    reject(e);
                  }
                }, 0);
              } else if (self.state === 'rejected') {
                setTimeout(function() {
                  try {
                    var x = onRejected ? onRejected(self.reason) : self.reason;
                    resolve(x);
                  } catch (e) {
                    reject(e);
                  }
                }, 0);
              } else {
                self.onFulfilledCallbacks.push(function(value) {
                  setTimeout(function() {
                    try {
                      var x = onFulfilled ? onFulfilled(value) : value;
                      resolve(x);
                    } catch (e) {
                      reject(e);
                    }
                  }, 0);
                });
                self.onRejectedCallbacks.push(function(reason) {
                  setTimeout(function() {
                    try {
                      var x = onRejected ? onRejected(reason) : reason;
                      resolve(x);
                    } catch (e) {
                      reject(e);
                    }
                  }, 0);
                });
              }
            });
            return promise2;
          };
        }
        
        // Polyfill for Object.assign
        if (typeof Object.assign !== 'function') {
          Object.assign = function(target) {
            if (target == null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            var to = Object(target);
            for (var index = 1; index < arguments.length; index++) {
              var nextSource = arguments[index];
              if (nextSource != null) {
                for (var nextKey in nextSource) {
                  if (Object.prototype.hasOwnProperty.call(nextSource, nextKey)) {
                    to[nextKey] = nextSource[nextKey];
                  }
                }
              }
            }
            return to;
          };
        }
        
        // Polyfill for Array.find
        if (!Array.prototype.find) {
          Array.prototype.find = function(predicate) {
            if (this == null) {
              throw new TypeError('Array.prototype.find called on null or undefined');
            }
            if (typeof predicate !== 'function') {
              throw new TypeError('predicate must be a function');
            }
            var list = Object(this);
            var length = parseInt(list.length) || 0;
            var thisArg = arguments[1];
            for (var i = 0; i < length; i++) {
              var element = list[i];
              if (predicate.call(thisArg, element, i, list)) {
                return element;
              }
            }
            return undefined;
          };
        }
        
        // Polyfill for Array.filter
        if (!Array.prototype.filter) {
          Array.prototype.filter = function(callback, thisArg) {
            var T, k;
            if (this == null) {
              throw new TypeError('Array.prototype.filter called on null or undefined');
            }
            var O = Object(this);
            var len = parseInt(O.length) || 0;
            if (typeof callback !== 'function') {
              throw new TypeError(callback + ' is not a function');
            }
            if (thisArg) {
              T = thisArg;
            }
            k = 0;
            var res = [];
            var val;
            while (k < len) {
              if (k in O) {
                val = O[k];
                if (callback.call(T, val, k, O)) {
                  res.push(val);
                }
              }
              k++;
            }
            return res;
          };
        }
        
        // Polyfill for Array.map
        if (!Array.prototype.map) {
          Array.prototype.map = function(callback, thisArg) {
            var T, A, k;
            if (this == null) {
              throw new TypeError('Array.prototype.map called on null or undefined');
            }
            var O = Object(this);
            var len = parseInt(O.length) || 0;
            if (typeof callback !== 'function') {
              throw new TypeError(callback + ' is not a function');
            }
            if (thisArg) {
              T = thisArg;
            }
            A = new Array(len);
            k = 0;
            while (k < len) {
              var kValue, mappedValue;
              if (k in O) {
                kValue = O[k];
                mappedValue = callback.call(T, kValue, k, O);
                A[k] = mappedValue;
              }
              k++;
            }
            return A;
          };
        }
        
        console.log('Browser compatibility polyfills loaded');
      })();

      // Force proper viewport handling for iPhone
      function fixViewportForiPhone() {
        const viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          // Force viewport to fit iPhone screen
          viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
        }
        
        // Force body and html to fit viewport
        document.documentElement.style.width = '100vw';
        document.documentElement.style.height = '100vh';
        document.documentElement.style.height = '-webkit-fill-available';
        document.body.style.width = '100vw';
        document.body.style.height = '100vh';
        document.body.style.height = '-webkit-fill-available';
        document.body.style.overflowX = 'hidden';
        
        // Force App container to fit
        const appElement = document.getElementById('root');
        if (appElement) {
          appElement.style.width = '100vw';
          appElement.style.height = '100vh';
          appElement.style.height = '-webkit-fill-available';
          appElement.style.overflowX = 'hidden';
        }
      }
      
      // Run on load and orientation change
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fixViewportForiPhone);
      } else {
        fixViewportForiPhone();
      }
      
      // Fix on orientation change
      window.addEventListener('orientationchange', function() {
        setTimeout(fixViewportForiPhone, 100);
      });
      
      // Fix on resize
      window.addEventListener('resize', fixViewportForiPhone);
      
      // Force viewport fix every 500ms for first 5 seconds
      let fixCount = 0;
      const viewportFixInterval = setInterval(() => {
        fixViewportForiPhone();
        fixCount++;
        if (fixCount >= 10) {
          clearInterval(viewportFixInterval);
        }
      }, 500);
    </script>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
